<!doctype html><html lang=zh-CN><head><meta charset=utf-8><meta name=robots content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#f7f3ec" media="(prefers-color-scheme: light)"><meta name=theme-color content="#2a2622" media="(prefers-color-scheme: dark)"><title>X 关注日报 · 往期</title><style>:root{
  --paper:oklch(97.4% .009 82);--paper2:oklch(94.6% .013 82);--paper3:oklch(91% .016 80);
  --ink:oklch(22% .014 60);--ink2:oklch(38% .014 60);--ink3:oklch(52% .012 65);--rule:oklch(87% .013 80);
  --acc:oklch(51% .145 33);--acc2:oklch(43% .13 33);--acc-bg:oklch(93.5% .03 45);
  --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --pad:max(16px, env(safe-area-inset-left)); --padr:max(16px, env(safe-area-inset-right));
  --tap:44px; --bar-h:0px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:oklch(18% .01 60);--paper2:oklch(22% .012 60);--paper3:oklch(28% .012 60);
    --ink:oklch(94% .008 80);--ink2:oklch(78% .01 80);--ink3:oklch(62% .01 70);--rule:oklch(32% .012 60);
    --acc:oklch(68% .14 35);--acc2:oklch(60% .12 35);--acc-bg:oklch(28% .04 40);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(96px + env(safe-area-inset-top));overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:clip;
  padding-bottom:env(safe-area-inset-bottom)}
::selection{background:var(--acc-bg);color:var(--ink)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
img{max-width:100%;height:auto}
.wrap{max-width:40rem;margin:0 auto;padding:0 var(--padr) var(--s8) var(--pad);overflow-wrap:anywhere;word-break:break-word}
/* masthead */
.mast{padding:calc(var(--s6) + env(safe-area-inset-top)) 0 var(--s4);border-bottom:1px solid var(--ink);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-4px;border-bottom:1px solid var(--ink)}
.date{display:flex;justify-content:space-between;gap:var(--s2);margin:0;font-size:12px;color:var(--ink3);letter-spacing:.04em}
.mast h1{font-family:var(--serif);font-weight:900;font-size:clamp(36px,11vw,56px);line-height:1.08;letter-spacing:-.02em;margin:var(--s2) 0 var(--s3);text-wrap:balance}
.dek{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink2);max-width:40em;text-wrap:pretty}
.dek .rule{display:inline;margin:0 0 0 6px;font-size:12.5px;vertical-align:baseline}
.dek .rule summary{display:inline-flex;align-items:center;min-height:28px;padding:0;color:var(--ink3);cursor:pointer;list-style:none;white-space:nowrap;vertical-align:baseline}
.dek .rule summary::-webkit-details-marker{display:none}
.dek .rule summary::after{content:"＋";margin-left:4px;font-size:11px}
.dek .rule[open] summary::after{content:"－"}
.dek .rule[open]{display:block;margin:8px 0 0}
.dek .rule[open] p{display:block;margin:6px 0 0;font-size:13px;line-height:1.7;color:var(--ink2);max-width:40em}
@media(max-width:390px){
  .dek{font-size:13.5px;line-height:1.55}
  .dek .rule{font-size:12px;margin-left:4px}
  .dek .rule summary{min-height:24px}
}
/* brief */
.brief{padding:var(--s5) 0 var(--s2)}
.brief h2,.bh{font-family:var(--serif);font-weight:900;font-size:13px;letter-spacing:.14em;margin:0 0 var(--s2);color:var(--acc)}
.brief ol{list-style:none;margin:0;padding:0}
.brief li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2) var(--s3);align-items:start;border-top:1px solid var(--rule);padding:var(--s3) 0;min-height:var(--tap)}
.brief li:first-child{border-top:0}
.brief li a{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:var(--s2);align-items:start;text-decoration:none;min-width:0}
.brief .tt{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.45;text-wrap:pretty;overflow-wrap:anywhere}
.brief li a:active .tt{color:var(--acc)}
.brief .tp{font-size:11px;color:var(--ink3);white-space:nowrap;padding-top:4px}
.brief li.is-read .tt,.brief li.is-read .n{color:var(--ink3);opacity:.65}
.brief li.is-read .tt::after{content:" 已阅";font:11px var(--sans);color:var(--ink3)}
.n{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--ink3);line-height:1.3}.n.hi{color:var(--acc)}.n.mid{color:var(--ink)}
/* sticky bar — compact on phone */
.bar{position:sticky;top:0;z-index:20;margin:var(--s4) calc(-1 * var(--pad)) 0;padding:0 var(--padr) 0 var(--pad);padding-top:env(safe-area-inset-top);
  background:color-mix(in oklch,var(--paper) 88%,transparent);backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);
  border-bottom:1px solid var(--rule)}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);align-items:center;padding:8px 0 0;font-size:12px;color:var(--ink2);min-height:28px}
.prog .pl{white-space:nowrap}.prog b{color:var(--ink);font-weight:600}
.track{height:3px;background:var(--paper3);border-radius:2px;overflow:hidden}
#pr-f{display:block;height:100%;width:0;background:var(--acc);transition:width .55s var(--ease)}
.prog-end{display:flex;align-items:center;gap:8px;white-space:nowrap}
#pr-p{color:var(--ink3);min-width:2.8ch;text-align:right}
.sy{font-size:11px;color:var(--ink3);max-width:4.5em;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:0 var(--pad);scroll-padding-inline:var(--pad)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;font-size:13px;line-height:1;padding:12px 10px;min-height:var(--tap);display:inline-flex;align-items:center;gap:4px;
  text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on,nav a:active{color:var(--ink);border-color:var(--acc)}

.rule{margin:var(--s4) 0 0;font-size:13px;color:var(--ink2)}
.rule summary{cursor:pointer;color:var(--ink3);list-style:none;display:inline-flex;align-items:center;min-height:var(--tap);padding:0 2px}
.rule summary::-webkit-details-marker{display:none}.rule summary::after{content:"＋";margin-left:6px;font-size:11px}
.rule[open] summary::after{content:"－"}.rule p{margin:0 0 var(--s2);line-height:1.7}.rule b{color:var(--ink);font-weight:600}
/* topic */
.topic{margin-top:var(--s7)}
.topic>details>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  padding:var(--s2) 0;min-height:var(--tap);border-bottom:2px solid var(--ink)}
.topic>details>summary::-webkit-details-marker{display:none}
.topic h2{font-family:var(--serif);font-weight:900;font-size:clamp(22px,6.5vw,28px);line-height:1.2;letter-spacing:-.01em;margin:0;min-width:0}
.cnt{font-size:12px;color:var(--ink3);white-space:nowrap;flex:none}.topic.done .cnt{color:var(--acc)}
/* item */
.item{padding:var(--s5) 0 var(--s4);border-bottom:1px solid var(--rule);transition:opacity .35s var(--ease)}
.ih{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:start}
h3{font-family:var(--serif);font-weight:800;font-size:clamp(18px,5.2vw,22px);line-height:1.4;margin:0;text-wrap:pretty;letter-spacing:-.005em;overflow-wrap:anywhere}
h3 a.tl{color:inherit;text-decoration:none;display:inline;background-image:linear-gradient(currentColor,currentColor);background-position:0 100%;background-repeat:no-repeat;background-size:0 1px;transition:background-size .35s var(--ease),color .2s}
h3 a.tl:hover,h3 a.tl:focus-visible{background-size:100% 1px;color:var(--acc)}
h3 .ext{display:inline-block;margin-left:.28em;font-size:.72em;font-weight:600;font-family:var(--sans);color:var(--ink3);opacity:0;transform:translateY(.05em);transition:opacity .25s var(--ease),color .2s;vertical-align:baseline}
h3 a.tl:hover .ext,h3 a.tl:focus-visible .ext,h3 a.tl:active .ext{opacity:1;color:var(--acc)}
@media (hover:none){h3 .ext{opacity:.55}}
.by{margin:var(--s2) 0 0;font-size:12.5px;color:var(--ink3);line-height:1.55;display:flex;flex-wrap:wrap;gap:2px 0;align-items:center}
.by span{display:inline}.by span::before{content:"·";margin:0 6px;opacity:.7}
.by .hdl{color:var(--ink2);text-decoration:none;font-weight:500}.by .hdl:hover{color:var(--acc);text-decoration:underline}
.by .fmt{margin-left:6px}.by .fmt::before{content:none}
.body{margin-top:var(--s3)}.lede{margin:0;max-width:62ch;text-wrap:pretty;font-size:15.5px;line-height:1.75}
h4{font-family:var(--serif);font-size:12.5px;font-weight:900;letter-spacing:.12em;color:var(--acc);margin:var(--s4) 0 var(--s1)}
.pts{margin:0;padding:0;list-style:none}.pts li{position:relative;padding-left:1em;margin:6px 0;line-height:1.7;font-size:15.5px}
.pts li::before{content:"";position:absolute;left:0;top:.85em;width:.4em;height:1px;background:var(--ink2)}
.note{margin:var(--s4) 0 0;padding:var(--s3) 0 0;border-top:1px dashed var(--rule);font-size:15px;line-height:1.7}
.note p{margin:0}.note p+p{margin-top:var(--s3)}
.note b{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.08em;margin-bottom:2px}
.also{margin:var(--s4) 0 0;padding:var(--s3);border:1px solid var(--rule);border-radius:8px;background:var(--paper2)}
.also h4{margin:0 0 var(--s2);font-family:var(--serif);font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--acc)}
.also ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.also li{margin:0;border-top:1px solid color-mix(in oklch,var(--rule) 70%,transparent)}
.also li:first-child{border-top:0}
.also .av{display:grid;gap:2px;padding:10px 0;min-height:var(--tap)}
.also .who{margin:0;font-size:13.5px;line-height:1.4}
.also b{font-weight:600;color:var(--ink)}
.also .hdl{font-size:12.5px;color:var(--ink2);text-decoration:none;font-weight:500;margin-left:4px}
.also .hdl:hover{color:var(--acc);text-decoration:underline}
.also .aw{display:block;font-size:13.5px;line-height:1.55;color:var(--ink2);text-decoration:none;overflow-wrap:anywhere;padding:2px 0}
.also .aw:hover,.also .aw:focus-visible{color:var(--ink);text-decoration:underline}
.also-more{margin-top:4px;border-top:1px dashed var(--rule);padding-top:4px}
.also-more summary{cursor:pointer;list-style:none;min-height:var(--tap);display:flex;align-items:center;font-size:13px;color:var(--ink3)}
.also-more summary::-webkit-details-marker{display:none}
.also-more summary::after{content:"＋";margin-left:6px;font-size:11px}
.also-more[open] summary::after{content:"－"}
/* images */
.imgs{display:grid;gap:var(--s2);margin:var(--s4) 0 0}.imgs[data-n="2"]{grid-template-columns:1fr 1fr}
.imgs figure{margin:0;position:relative;background:var(--paper2);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 0 oklch(22% .014 60/.06),0 8px 20px -12px oklch(30% .03 60/.35)}
.imgs img{display:block;width:100%;height:auto;max-height:min(52vh,420px);object-fit:contain;background:var(--paper2)}
figcaption{position:absolute;right:8px;bottom:8px;font-size:11px;line-height:1;background:color-mix(in oklch,var(--paper) 92%,transparent);color:var(--ink2);padding:5px 8px;border-radius:4px}
/* action row — mobile: 已阅 | 有用·没用, then metrics */
.if{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s4);align-items:stretch}
.if .rd{grid-column:1}.if .votes{grid-column:2;justify-content:stretch}
.if .mt{grid-column:1 / -1;order:3;justify-content:flex-start;padding:4px 0 0}
.mt{display:flex;gap:var(--s3);font-size:12px;color:var(--ink3);flex-wrap:wrap}
.rd,.votes button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 12px;font-size:13px;
  border:1px solid var(--rule);border-radius:999px;color:var(--ink2);width:100%;transition:background .2s var(--ease),color .2s,border-color .2s,transform .12s}
.rd svg{opacity:.4;flex:none}.rd:active,.votes button:active{transform:scale(.98)}
.rd[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}.rd[aria-pressed=true] svg{opacity:1}
.votes{display:inline-flex;gap:6px;width:100%}
.votes button[aria-pressed=true].vu{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.votes button[aria-pressed=true].vd{background:var(--ink);border-color:var(--ink);color:var(--paper)}
article.is-read{opacity:.48}article.is-read:focus-within{opacity:.9}article.is-read .body{display:none}article.is-read.peek .body{display:block}
/* seal — quiet typographic score + thin ring */
.seal{position:relative;z-index:2;flex:none}
.seal summary{list-style:none;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:52px;height:52px;min-width:var(--tap);min-height:var(--tap);border:0;border-radius:50%;
  color:var(--ink2);background:transparent;touch-action:manipulation;transition:color .25s var(--ease);padding-top:2px}
.seal summary::-webkit-details-marker{display:none}
.seal .ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.seal .rg-t{stroke:var(--rule)}
.seal .rg-a{stroke:var(--ink3);transition:stroke .25s}
.seal .num{position:relative;z-index:1;font-family:var(--serif);font-weight:900;font-size:17px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.seal .meter{position:relative;z-index:1;display:flex;gap:2px;align-items:flex-end;height:5px}
.seal .meter i{width:3px;height:calc(var(--v)*5px + 1px);background:currentColor;opacity:.5;border-radius:1px}
.seal.mid summary{color:var(--acc)}.seal.mid .rg-a{stroke:var(--acc)}
.seal.hi summary{color:var(--acc)}.seal.hi .rg-a{stroke:var(--acc);stroke-width:1.85}
.seal.lo .rg-a{stroke:var(--ink3)}
.seal summary:hover .rg-a,.seal summary:focus-visible .rg-a{stroke:var(--acc)}
.seal[open] summary{color:var(--acc)}.seal[open] .rg-a{stroke:var(--acc)}
.bd{position:absolute;top:56px;left:0;z-index:30;width:min(248px, calc(100vw - 2*var(--pad) - 8px));margin:0;background:var(--paper);border:1px solid var(--rule);
  padding:var(--s3) var(--s3) var(--s4);font-size:12.5px;box-shadow:0 14px 32px -16px oklch(25% .03 60/.45);animation:pop .28s var(--ease);border-radius:2px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.bdh{font-family:var(--serif);font-weight:900;font-size:12.5px;letter-spacing:.08em;color:var(--ink2);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.bdh b{float:right;color:var(--acc);font-size:15px}
.bd>div:not(.bdh){display:grid;grid-template-columns:2.6em 1fr 3.2em;gap:8px;align-items:center;margin:5px 0}
.bd dt{color:var(--ink2)}.bd dd{margin:0}
.bd dd span{display:block;height:5px;background:linear-gradient(90deg,var(--acc) calc(var(--v)*100%),var(--paper3) 0);border-radius:3px}
.bd .v{text-align:right;font-weight:600}.bd .v small{color:var(--ink3);font-weight:400}
/* briefs / cands */
.bh{margin-top:var(--s5)}.briefs{list-style:none;margin:0;padding:0}
.briefs li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:var(--s2) var(--s3);padding:var(--s3) 0;border-top:1px solid var(--rule)}
.briefs li p{margin:0;font-size:15px;line-height:1.65;min-width:0}.briefs li p a{color:var(--ink3);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:6px 4px;margin:-6px 0}
.briefs .br{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.briefs .rd,.briefs .votes{width:auto}.briefs .rd,.briefs .votes button{width:auto;min-width:72px;padding:0 12px;font-size:12.5px}
.briefs li.is-read{opacity:.45}
.fmt{display:inline-block;font-size:10.5px;color:var(--acc);border:1px solid color-mix(in oklch,var(--acc) 40%,transparent);padding:1px 6px;border-radius:3px;letter-spacing:.03em;vertical-align:middle}
.cands{margin-top:var(--s7)}.cands>details>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  padding:var(--s2) 0;min-height:var(--tap);border-bottom:1px dashed var(--ink2)}
.cands h2{font-family:var(--serif);font-weight:900;font-size:20px;margin:0;color:var(--ink2)}
.colophon{margin-top:var(--s7);text-align:center;font-size:12px;color:var(--ink3);padding-bottom:env(safe-area-inset-bottom)}
.colophon p{margin:4px 0}.colophon a{color:var(--acc);display:inline-flex;align-items:center;min-height:var(--tap);padding:0 4px}
/* ≥480: loosen action row */
@media(min-width:480px){
  :root{--pad:max(20px, env(safe-area-inset-left));--padr:max(20px, env(safe-area-inset-right))}
  body{font-size:17px}
  .if{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3)}
  .if .rd,.if .votes,.if .mt{grid-column:auto;order:initial;width:auto}
  .rd,.votes button{width:auto;min-width:5.5em}
  .prog{grid-template-columns:auto 1fr auto auto}
  .sy{max-width:none}
  h3 .ext{opacity:.4}
}
@media(min-width:768px){
  :root{--pad:max(24px, env(safe-area-inset-left));--padr:max(24px, env(safe-area-inset-right))}
  .wrap{max-width:42rem}
  .brief .tt{font-size:17.5px}
  h3{font-size:22px}
  .lede,.pts li{font-size:16.5px}
  .imgs{margin-inline:0}
  .imgs img{max-height:min(56vh,480px)}
  nav{margin-inline:0;padding-inline:0;gap:6px}
  .bar{margin-inline:0;margin-top:var(--s5)}
  .seal summary{width:56px;height:56px}
  .seal .num{font-size:19px}
  .ih{gap:var(--s4)}
}
@media(min-width:1280px){
  .wrap{max-width:44rem}
  .mast h1{font-size:56px}
  .bar{border-bottom-color:color-mix(in oklch,var(--rule) 85%,transparent)}
  .prog{padding-top:10px;font-size:13px}
  nav a{padding:14px 12px;font-size:14px}
  .item{padding:var(--s6) 0 var(--s5)}
  .if{gap:var(--s3) var(--s4);margin-top:var(--s5)}
  .imgs[data-n="2"]{gap:var(--s3)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
@media (hover:none){h3 a.tl{background-size:0 0}}
/* 稍后看 */
.sv{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:var(--tap);min-width:var(--tap);padding:0 10px;font-size:12.5px;color:var(--ink3);border:1px solid transparent;border-radius:999px;transition:color .2s,background .2s,border-color .2s}
.sv span{display:none}.sv:hover{color:var(--ink2);border-color:var(--rule)}
.sv[aria-pressed=true]{color:var(--acc)}.sv[aria-pressed=true] svg path{fill:currentColor}
.if .sv{grid-column:1 / -1;order:2;justify-self:start;margin-left:-10px}
.if .sv span{display:inline}
.svl{font-size:11px;color:var(--ink3);text-decoration:none;min-height:28px;display:inline-flex;align-items:center;gap:3px;padding-left:6px;border-left:1px solid var(--rule)}
.svl b{font-weight:600;color:var(--acc)}
@media(min-width:480px){.if .sv{grid-column:auto;order:initial;margin-left:auto}}
/* v7：三段进度（已阅 / 已收藏未读 / 未看） */
:root{--sv:oklch(68% .12 80)}
@media (prefers-color-scheme:dark){:root{--sv:oklch(78% .11 85)}}
.track{display:flex}
#pr-f,#pr-s{flex:none}
#pr-s{display:block;height:100%;width:0;background:var(--sv);transition:width .55s var(--ease)}
.lg{display:flex;gap:14px;margin:6px 0 0;font-size:11.5px;color:var(--ink3)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--paper3)}
.lg .r::before{background:var(--acc)}.lg .s::before{background:var(--sv)}
.lg b{color:var(--ink2);font-weight:600}
.tb{display:flex;height:2px;border-radius:1px;background:var(--paper3);overflow:hidden}
.tb i{display:block;height:100%;width:0;transition:width .5s var(--ease)}.tb .r{background:var(--acc)}.tb .s{background:var(--sv)}
nav a{position:relative}


/* v7：推荐原因（标题下、摘要上） */
.why{margin:0 0 var(--s3);padding:8px 12px;border-radius:8px;background:var(--acc-bg);font-size:14px;line-height:1.6;color:var(--ink2)}
.why b{font-size:11.5px;font-weight:700;color:var(--acc);letter-spacing:.08em;margin-right:8px}
/* v7：评论总结 */
.cmts{margin:var(--s5) 0 var(--s4);padding:var(--s4);border:1px solid var(--rule);border-radius:10px;background:var(--paper2)}
.cmts h4{margin:0 0 4px;font-family:var(--serif);font-weight:900;font-size:15px;color:var(--acc);letter-spacing:.06em}
.cmts .cms{margin:0 0 var(--s3);font-size:12px;color:var(--ink3);line-height:1.6}
.cmts .cms a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.cmts ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.cmts li{font-size:14.5px;line-height:1.7}
.cmts li b{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;margin-right:6px;border-radius:4px;border:1px solid var(--rule);color:var(--ink2);vertical-align:1px}
/* v8 每条评论总结 */
.cmts.ci{margin:var(--s4) 0 0;padding:12px 14px}
.cmts.ci h4{font-size:13px;margin-bottom:8px}
.cmts.ci li{font-size:14px;line-height:1.65}
.cmts.cn .cms{margin:0}
.cmts.cc{margin:8px 0 0;padding:8px 12px;background:transparent}
.cmts.cc summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--acc);list-style:none}
.cmts.cc summary::-webkit-details-marker{display:none}
.cmts.cc summary::before{content:"▸ ";color:var(--ink3)}
.cmts.cc[open] summary::before{content:"▾ "}
.cmts.cc ul{margin-top:8px}
.cmts.cc li{font-size:13.5px}
/* v9 简讯评论总结：独占一行，不撑高按钮行 */
.briefs li{grid-template-columns:2.2em minmax(0,1fr)!important;align-items:start}
.briefs li>p{grid-column:2}
.briefs li>.cmts.cc{grid-column:2;grid-row:auto;width:100%;min-width:0;margin:2px 0 0;padding:0;border:0;background:none;border-radius:0}
.briefs li>.cmts.cc summary{display:inline-flex;align-items:center;white-space:nowrap;min-height:32px;padding:0 2px;font-size:12.5px}
.briefs li>.cmts.cc[open]{padding:4px 12px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper2)}
.briefs li>.br{grid-column:2;align-items:center}
.briefs .br .rd,.briefs .br .votes button{height:36px;min-height:36px;align-self:center;flex:none;border-radius:999px}
.briefs .br .votes{width:auto;align-items:center;flex:none}
.if{align-items:center}
.briefs .cmts li{display:block!important;grid-template-columns:none!important;padding:0;border:0;opacity:1}
.cmts li b{white-space:nowrap}

/* v12 引用原帖子卡片 */
.qc{margin:var(--s4) 0 0;padding:var(--s3) var(--s4);border:1px solid var(--rule);border-left:3px solid var(--ink3);border-radius:4px;background:var(--paper2)}
.qc .qh{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12.5px;color:var(--ink3)}
.qc .ql{font-weight:600;color:var(--ink2);letter-spacing:.02em}.qc .qs{margin-left:auto}
.qc h4{margin:6px 0 0;font-family:var(--serif);font-size:16.5px;line-height:1.45;font-weight:700}.qc h4 a{text-decoration:none;color:var(--ink)}
.qc p:not(.qh){margin:6px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.qc .qb{margin-top:var(--s2);display:flex}
.qc .sv{margin-left:-10px}.qc .sv span{display:inline}.qc .qb{margin-top:4px}
.briefs li>.qc{grid-column:2;margin:4px 0 0;min-width:0}.briefs li>.qc h4{font-size:15.5px}.briefs li>.qc p:not(.qh){font-size:14px}

/* ===== v13 UI ===== */
.date{align-items:center}
.past{font-size:12px;color:var(--acc);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 12px;border:1px solid color-mix(in oklch,var(--acc) 35%,transparent);border-radius:999px;letter-spacing:.02em}
.past::after{content:"→";font-size:11px}.past:hover{background:color-mix(in oklch,var(--acc) 8%,transparent)}
/* sticky：左 已阅+%｜中 进度条｜右 同步点+收藏夹，同一基线 */
.prog{display:grid!important;grid-template-columns:auto 1fr auto!important;column-gap:12px;align-items:center;min-height:36px;padding:6px 0 0;font-size:12.5px;line-height:1}
.prog .pl{display:inline-flex;align-items:baseline;gap:0;white-space:nowrap;font-variant-numeric:tabular-nums}
#pr-p{min-width:0;margin-left:8px;color:var(--ink3);font-size:11.5px}.prog .pl b{margin:0 1px 0 4px}
.prog-end{display:inline-flex;align-items:center;gap:10px}
.sy{display:inline-flex;align-items:center;gap:5px;max-width:none;font-size:11.5px;color:var(--ink3);overflow:visible}
.sy i{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.sy[data-st=ok] i{background:oklch(65% .14 150)}.sy[data-st=off] i{background:oklch(65% .15 30)}.sy[data-st=ing] i{animation:syp 1s ease-in-out infinite alternate}
@keyframes syp{to{opacity:.3}}
.syt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(min-width:480px){.syt{position:static;width:auto;height:auto;clip:auto}}
.svl{font-size:12.5px;min-height:28px;padding:0 0 0 10px;line-height:1}
nav{margin:2px calc(-1 * var(--pad)) 0;padding:0 var(--pad)}
nav a:first-child{padding-left:0}
@media(min-width:768px){nav{margin-inline:0;padding-inline:0}}
/* 卡片：数据挪到作者行下面；底部按钮同高居中 */
.hd .mt{margin:4px 0 0;font-size:12px;color:var(--ink3);gap:12px;font-variant-numeric:tabular-nums}
.if,.if{display:flex!important;flex-wrap:nowrap;align-items:center;gap:8px;margin-top:var(--s4)}
.if .rd,.if .votes button,.if .sv{height:40px;min-height:40px;box-sizing:border-box}
.if .rd{flex:none;min-width:6.5em;padding:0 16px;font-size:14px;font-weight:600}
.if .votes{display:inline-flex;width:auto;flex:none;gap:6px}
.if .votes button{min-width:4em;padding:0 12px;font-size:13px}
.if .sv{margin-left:auto!important;order:0;grid-column:auto;padding:0 12px;font-size:13.5px;border-color:var(--rule);flex:none}
.if .sv svg{width:16px;height:16px}
@media(max-width:360px){.if .rd{min-width:0;padding:0 12px}.if .votes button{min-width:0;padding:0 10px}}
article.item,li.item{scroll-margin-top:calc(var(--stick,88px) + 8px)}
.if .rd,.if .votes,.if .votes button,.if .sv{width:auto!important}

/* ===== v14 UI ===== */
.issue-nav{display:flex;justify-content:space-between;gap:12px;margin:var(--s6) 0 var(--s4);padding-top:var(--s4);border-top:1px solid var(--rule)}

.issue-nav a{color:var(--acc);border-color:color-mix(in oklch,var(--acc) 35%,transparent)}
.issue-nav a:hover{background:color-mix(in oklch,var(--acc) 8%,transparent)}
.issue-nav a.prev::before{content:"←";font-size:13px}
.issue-nav a.next::after{content:"→";font-size:13px}
.issue-nav span.disabled{opacity:.4;cursor:default;pointer-events:none}
@media(max-width:390px){.issue-nav a,.issue-nav span{font-size:13px;padding:0 10px}}

/* ===== v15 UI ===== */
.hdr-r{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.past.svh::after{content:none}.past.svh b{font-weight:700;margin-left:2px}
.tools{margin:var(--s3) 0 0}
.uf{font-size:12.5px;min-height:32px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;color:var(--ink2)}
.uf[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.only-unread .topic .item.is-read{display:none}
/* sticky bar：左 已阅｜进度条｜右 状态点 */
.sy{gap:0}.sy .syt:empty{display:none}.sy[data-st=off] .syt{position:static;width:auto;height:auto;clip:auto;margin-left:5px;color:oklch(55% .15 30)}
.sy[data-st=ok] i{opacity:.55}
.bar nav{gap:2px}
.bar nav a{position:relative;gap:6px;padding:12px 10px 13px;border-bottom:0;margin-bottom:0}
.bar nav a:first-child{padding-left:0}
.bar nav .tc{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar nav a.on .tn{color:var(--ink);font-weight:600}.bar nav a.done .tc{color:var(--acc)}
.bar nav .tf{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:2px;background:var(--paper3);overflow:hidden}
.bar nav a:first-child .tf{left:0}
.bar nav .tf b{display:block;height:100%;width:0;background:var(--acc);transition:width .5s var(--ease)}
.bar nav a.on .tf{background:color-mix(in oklch,var(--acc) 22%,var(--paper3))}
/* 底部期次导航：不受 nav 横向滚动/负边距影响，完整显示 + 安全区 */
nav.issue-nav{overflow:visible;margin:var(--s6) 0 var(--s4);padding:var(--s4) 0 6px;scroll-padding:0}
nav.issue-nav a,nav.issue-nav span{flex:1 1 0;min-width:0;padding:10px 14px;line-height:1.3;margin:0;border-bottom-width:1px;box-sizing:border-box;white-space:nowrap}
.colophon{padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom))}

.dek .uf{margin-left:4px;min-height:28px;padding:0 12px;font-size:12px;vertical-align:baseline}
.dek .rule[open]+.uf{margin:8px 0 0}
#pr-f{transition:none}

/* ===== v16 只看未读开关 ===== */
.tabrow{display:flex;align-items:center;margin:2px calc(-1 * var(--pad)) 0}
.tabrow nav{flex:1 1 auto;min-width:0;margin:0;padding:0 8px 0 var(--pad);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}
.swl{flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 var(--padr) 0 10px;border-left:1px solid var(--rule);min-height:28px;font-size:12px;color:var(--ink3);cursor:pointer;white-space:nowrap;user-select:none}
.sw{position:relative;width:32px;height:18px;border-radius:999px;background:var(--paper3);transition:background .2s var(--ease);flex:none}
.sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.25);transition:transform .2s var(--ease)}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true] i{transform:translateX(14px)}
.swl:has(.sw[aria-checked=true]){color:var(--ink2)}
@media(min-width:768px){.tabrow{margin-inline:0}.tabrow nav{padding-left:0}.swl{padding-right:0}}

ol{list-style:none;margin:24px 0 0;padding:0}li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;min-height:var(--tap);border-bottom:1px solid var(--rule)}
li a{text-decoration:none;display:flex;align-items:baseline;gap:10px}.t{font-family:var(--serif);font-weight:800;font-size:21px}.y{font-size:12px;color:var(--ink3)}
